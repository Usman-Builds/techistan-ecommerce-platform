# =============================================================================
# Render blueprint for Techistan: the API plus both Next.js clients.
#
# Written to MATCH the live services (names, region, commands), which were
# created by hand. Syncing it into the same workspace would collide with
# those names, so use it to rebuild from scratch. See DEPLOY-RENDER.md.
#
# This file must sit at the ROOT OF THE GIT REPO, which for this project is
# ecommerce/ -- one level ABOVE Code/. That is why the two docker paths below
# are Code/-prefixed. If the repo is ever re-rooted at Code/ instead, this file
# moves down with it and those paths lose the prefix.
#
# Render reads this on "New > Blueprint". Everything marked "sync: false" is
# deliberately NOT in this file -- you fill those in the dashboard, and they
# never touch the repo. Everything marked "generateValue: true" is generated
# once by Render and stored there; you never see or need it.
#
# See Code/backend/DEPLOY-RENDER.md for the full runbook, including the
# "Frontends on Render" section.
# =============================================================================

services:
  - type: web
    name: techistan-ecommerce-platform
    runtime: docker

    # Oregon, because that is where the live services were created. The Neon
    # database is in us-east-2 (Ohio), so every query crosses the country (~230ms
    # measured from a laptop; same-region is single-digit ms). Moving all three
    # services to `ohio` is the biggest latency win available, but Render cannot
    # move a service: it means recreating them. Keep the three in one region.
    region: oregon

    # Free spins down after 15 minutes of no traffic and takes ~1 minute to come
    # back, and it has no shell and no pre-deploy command. Fine for showing the
    # site to someone; see the runbook before putting it in front of customers.
    plan: free

    # The build context is Code/, NOT the repo root. Every COPY in the
    # Dockerfile is written relative to Code/ (COPY backend/package.json, ...),
    # and .dockerignore -- which is what keeps node_modules and .env* out of the
    # upload -- is read from the root of the context and lives at Code/. Setting
    # this to "." is a build failure on the first COPY, not a slow build.
    #
    # Narrowing it further to ./Code/backend would now work too (the backend
    # stopped reaching outside its own directory when Code/shared was split up),
    # but that means dropping the "backend/" prefix from every COPY in the
    # Dockerfile and updating docker-compose.yml to match. Left as-is.
    dockerfilePath: ./Code/backend/Dockerfile
    dockerContext: ./Code

    healthCheckPath: /health
    autoDeployTrigger: commit

    # Migrations do NOT run here. preDeployCommand needs a paid instance type,
    # and the runtime image has the Prisma CLI stripped out of it anyway. Run
    # them from your machine against the Neon URL -- see the runbook. On a paid
    # plan you can move them here instead:
    #
    #   preDeployCommand: npx prisma migrate deploy
    #
    # which also means dropping "node_modules/prisma" from the rm line in the
    # prod-deps stage of backend/Dockerfile so the CLI survives into runtime.

    envVars:
      # --- fixed -------------------------------------------------------------
      # PORT is deliberately absent. Render injects its own and the app already
      # reads it; setting it here would override Render and the deploy would
      # hang on "no open ports detected".
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Techistan
      - key: SEARCH_DRIVER
        value: pg
      - key: JWT_EXPIRES_IN
        value: "86400"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "2592000"
      - key: ADMIN_EMAIL_ALERTS
        value: "false"
      - key: SMS_ENABLED
        value: "false"

      # --- generated by Render, never seen by anyone --------------------------
      # Regenerating any of these signs every user out; that is the only cost.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CART_COOKIE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Shared with both Next.js services below (they copy it with fromService).
      # Authenticates the x-client-ip header they forward, so the rate limiter
      # buckets per visitor instead of per frontend server. Without it every
      # visitor shares one bucket and the storefront 429s.
      - key: PROXY_SECRET
        generateValue: true

      # --- you fill these in the dashboard ------------------------------------
      # Neon. Use the POOLED host here (the one with -pooler): the app opens
      # many short connections and that is what the pooler is for. Migrations
      # are the exception and want the direct host.
      - key: DATABASE_URL
        sync: false

      # Where the two Next.js clients are actually served from. CORS runs with
      # credentials, so CLIENT_ORIGINS must match the browser's origin exactly --
      # scheme, host, no trailing slash. Read the SameSite note in the runbook
      # before choosing these hostnames; it decides whether login works at all.
      # For TESTING ONLY, CLIENT_ORIGINS=* allows every origin (see main.ts).
      # Opening CORS does not fix the SameSite problem.
      - key: USER_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false

      # Preseeded SUPER_ADMIN. Do NOT reuse the dev password.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Stripe. STRIPE_WEBHOOK_SECRET is the one from the DASHBOARD endpoint you
      # create for this deployment -- not the whsec_ that "stripe listen" prints
      # locally. They are different secrets.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ---------------------------------------------------------------------------
  # Next.js clients. Web services, NOT static sites: the /api/* rewrite,
  # proxy.ts and server components all need a running server.
  #
  # Commands run from the repo root (no rootDir), hence the `cd`. `-p $PORT`
  # overrides the hard-coded dev ports in package.json's start scripts.
  #
  # NEXT_PUBLIC_* values are baked in at BUILD time; change one, redeploy.
  # No buildFilter: every push to main redeploys all three services, on
  # purpose. Add `buildFilter.paths` per service to rebuild only on own changes.
  # ---------------------------------------------------------------------------
  - type: web
    name: techistan
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd Code/frontend/user_client && npm ci && npm run build
    startCommand: cd Code/frontend/user_client && npx next start -p $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22" # Next 16 needs >= 20.9
      - key: PROXY_SECRET
        fromService:
          type: web
          name: techistan-ecommerce-platform
          envVarKey: PROXY_SECRET
      # The API's public URL, e.g. https://techistan-ecommerce-platform.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # This storefront's own public URL (canonical URLs, sitemap, JSON-LD).
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      # The pk_ matching the API's STRIPE_SECRET_KEY (same account, same mode).
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

  - type: web
    name: techistan-admin
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd Code/frontend/admin_client && npm ci && npm run build
    startCommand: cd Code/frontend/admin_client && npx next start -p $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PROXY_SECRET
        fromService:
          type: web
          name: techistan-ecommerce-platform
          envVarKey: PROXY_SECRET
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # The storefront's public URL, for "view on storefront" links.
      - key: NEXT_PUBLIC_STOREFRONT_URL
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
